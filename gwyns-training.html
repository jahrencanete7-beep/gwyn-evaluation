<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gwyn's Training – CPA Board Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --dark: #0e0e12;
    --dark2: #17171f;
    --dark3: #1f1f2a;
    --border: #2c2c3a;
    --text: #e8e8f0;
    --muted: #7a7a95;
    --green: #3ecf8e;
    --red: #f05a5a;
    --blue: #5a8ef0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    min-height: 100vh;
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(135deg, #0a0a10 0%, #1a1428 50%, #0a0e18 100%);
    border-bottom: 1px solid var(--border);
    padding: 3rem 1.5rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-label {
    display: inline-block;
    font-size: .65rem;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(201,168,76,.35);
    padding: .35rem 1rem;
    border-radius: 99px;
    margin-bottom: 1.2rem;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 7vw, 4rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 60%, #a07830 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: .6rem;
  }
  .hero p {
    color: var(--muted);
    font-size: .95rem;
    font-weight: 300;
    letter-spacing: .04em;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    padding: 1.2rem 1.5rem;
    background: var(--dark2);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .82rem;
    color: var(--muted);
  }
  .stat-val {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
  }
  #score-stat .stat-val { color: var(--gold); }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    justify-content: center;
    gap: .75rem;
    flex-wrap: wrap;
    padding: 1.2rem 1.5rem;
    background: var(--dark2);
    border-bottom: 1px solid var(--border);
  }
  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    padding: .6rem 1.3rem;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
  }
  .btn:hover { transform: translateY(-1px); opacity: .85; }
  .btn-gold { background: var(--gold); color: #0e0e12; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

  /* ── FILTER TABS ── */
  .filter-tabs {
    display: flex;
    justify-content: center;
    gap: .5rem;
    flex-wrap: wrap;
    padding: 1rem 1.5rem;
    background: var(--dark);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    font-family: 'DM Sans', sans-serif;
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    padding: .38rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s;
  }
  .tab.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,.07); }
  .tab:hover { color: var(--text); border-color: #4a4a5a; }

  /* ── PROGRESS ── */
  .progress-wrap {
    padding: .8rem 1.5rem;
    background: var(--dark);
    border-bottom: 1px solid var(--border);
  }
  .progress-track {
    height: 4px;
    background: var(--dark3);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 99px;
    transition: width .4s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: .72rem;
    color: var(--muted);
    margin-bottom: .4rem;
  }

  /* ── QUIZ CONTAINER ── */
  .quiz-container {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .2s;
    animation: fadeUp .35s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .question-card.answered-correct { border-color: rgba(62,207,142,.4); }
  .question-card.answered-wrong   { border-color: rgba(240,90,90,.4); }

  .q-header {
    display: flex;
    align-items: center;
    gap: .8rem;
    padding: 1.1rem 1.4rem .8rem;
    border-bottom: 1px solid var(--border);
  }
  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--gold);
    min-width: 2rem;
  }
  .q-subject {
    font-size: .65rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: .2rem .65rem;
    border-radius: 99px;
    margin-left: auto;
  }

  .q-text {
    padding: 1.1rem 1.4rem 1rem;
    font-size: .95rem;
    line-height: 1.65;
    font-weight: 400;
    color: var(--text);
  }

  .options-list {
    padding: .2rem 1.4rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: .85rem;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: .75rem 1rem;
    cursor: pointer;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: .88rem;
    color: var(--text);
    line-height: 1.5;
    transition: all .15s;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--gold);
    background: rgba(201,168,76,.06);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct  { border-color: var(--green); background: rgba(62,207,142,.08); color: var(--green); }
  .option-btn.wrong    { border-color: var(--red);   background: rgba(240,90,90,.08);   color: var(--red); }
  .option-btn.reveal   { border-color: var(--green); background: rgba(62,207,142,.05); color: var(--green); opacity: .7; }
  .option-letter {
    font-weight: 700;
    font-size: .78rem;
    letter-spacing: .06em;
    min-width: 1.3rem;
    padding-top: .05rem;
    color: var(--muted);
  }
  .option-btn.correct .option-letter,
  .option-btn.reveal  .option-letter { color: var(--green); }
  .option-btn.wrong   .option-letter { color: var(--red); }

  .explanation {
    margin: 0 1.4rem 1.2rem;
    padding: .85rem 1rem;
    border-radius: 9px;
    background: rgba(90,142,240,.07);
    border-left: 3px solid var(--blue);
    font-size: .83rem;
    color: #a0b4e0;
    line-height: 1.6;
    display: none;
  }
  .explanation.show { display: block; animation: fadeUp .25s ease; }
  .explanation strong { color: var(--blue); }

  /* ── RESULT BANNER ── */
  .result-banner {
    display: none;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  .result-banner.show { display: block; animation: fadeUp .4s ease; }
  .result-card {
    background: linear-gradient(135deg, #17171f, #1f1f2a);
    border: 1px solid var(--gold);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    text-align: center;
  }
  .result-icon { font-size: 3rem; margin-bottom: 1rem; }
  .result-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--gold);
    margin-bottom: .5rem;
  }
  .result-score {
    font-size: 3.5rem;
    font-weight: 700;
    color: var(--text);
    margin: .5rem 0;
  }
  .result-score span { color: var(--gold); }
  .result-grade {
    display: inline-block;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: .4rem 1.2rem;
    border-radius: 99px;
    margin-bottom: 1.5rem;
  }
  .grade-pass  { background: rgba(62,207,142,.15); color: var(--green); border: 1px solid rgba(62,207,142,.3); }
  .grade-fail  { background: rgba(240,90,90,.15);  color: var(--red);   border: 1px solid rgba(240,90,90,.3); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: .72rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }

  /* ── HIDDEN ── */
  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .q-text { font-size: .88rem; }
    .option-btn { font-size: .82rem; }
    .stats-bar { gap: 1rem; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-label">CPA Board Exam Review</div>
  <h1>Gwyn's Training</h1>
  <p>100-Item Comprehensive Reviewer · Certified Public Accountant</p>
</div>

<div class="stats-bar">
  <div class="stat">Questions <span class="stat-val" id="total-stat">100</span></div>
  <div class="stat" id="score-stat">Score <span class="stat-val" id="score-val">0</span></div>
  <div class="stat">Answered <span class="stat-val" id="answered-val">0</span></div>
  <div class="stat">Remaining <span class="stat-val" id="remaining-val">100</span></div>
</div>

<div class="controls">
  <button class="btn btn-gold" onclick="submitAll()">Submit &amp; Score All</button>
  <button class="btn btn-outline" onclick="resetQuiz()">Reset Quiz</button>
  <button class="btn btn-outline" onclick="shuffleQuestions()">Shuffle Questions</button>
</div>

<div class="filter-tabs">
  <button class="tab active" onclick="filterTab(this,'all')">All</button>
  <button class="tab" onclick="filterTab(this,'FAR')">FAR</button>
  <button class="tab" onclick="filterTab(this,'AUD')">Auditing</button>
  <button class="tab" onclick="filterTab(this,'TAX')">Taxation</button>
  <button class="tab" onclick="filterTab(this,'MGT')">Management</button>
  <button class="tab" onclick="filterTab(this,'LAW')">Business Law</button>
  <button class="tab" onclick="filterTab(this,'COST')">Cost Acctg</button>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span>Progress</span>
    <span id="pct-label">0%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="quiz-container" id="quiz-container"></div>

<div class="result-banner" id="result-banner">
  <div class="result-card">
    <div class="result-icon" id="result-icon">🎓</div>
    <h2>Exam Results</h2>
    <div class="result-score"><span id="final-score">0</span> / 100</div>
    <div class="result-grade" id="result-grade">—</div>
    <p style="color:var(--muted);font-size:.9rem;" id="result-msg"></p>
    <br>
    <button class="btn btn-gold" onclick="resetQuiz()" style="margin-top:.5rem">Try Again</button>
  </div>
</div>

<footer>Gwyn's Training · CPA Board Exam Reviewer · For educational purposes only</footer>

<script>
const QUESTIONS = [
  // ── FINANCIAL ACCOUNTING & REPORTING (FAR) ──
  { id:1,  subj:'FAR',  q:'Under PAS 1, which financial statement presents the financial position of an entity at a specific date?',
    opts:['Income Statement','Statement of Financial Position','Statement of Cash Flows','Statement of Changes in Equity'],
    ans:1, exp:'PAS 1 requires a Statement of Financial Position (balance sheet) that shows assets, liabilities, and equity at a specific reporting date.' },
  { id:2,  subj:'FAR',  q:'Which inventory costing method assumes that the first items purchased are the first items sold?',
    opts:['Weighted Average','LIFO','FIFO','Specific Identification'],
    ans:2, exp:'FIFO (First-In, First-Out) assumes the oldest inventory is sold first, leaving the most recently purchased items in ending inventory.' },
  { id:3,  subj:'FAR',  q:'Under the accrual basis of accounting, revenues are recognized when:',
    opts:['Cash is received','Earned, regardless of cash receipt','The board approves','An invoice is issued'],
    ans:1, exp:'Accrual accounting recognizes revenue when it is earned (goods delivered or services rendered), not when cash is actually received.' },
  { id:4,  subj:'FAR',  q:'Goodwill arising from a business combination is:',
    opts:['Amortized over 40 years','Amortized over 20 years','Tested annually for impairment','Expensed immediately'],
    ans:2, exp:'Under PFRS 3, goodwill is not amortized but is instead tested for impairment at least annually or when indicators of impairment exist.' },
  { id:5,  subj:'FAR',  q:'Which of the following is NOT a component of other comprehensive income (OCI)?',
    opts:['Unrealized gains on FVOCI investments','Foreign currency translation adjustments','Net income from operations','Remeasurements of defined benefit plans'],
    ans:2, exp:'Net income from operations is reported in the income statement, not in OCI. OCI includes items that bypass profit or loss per the applicable PFRS.' },
  { id:6,  subj:'FAR',  q:'The double-declining balance method produces:',
    opts:['Equal depreciation each period','Higher depreciation in early years','Higher depreciation in later years','Same total depreciation as straight-line over an asset\'s life'],
    ans:1, exp:'The DDB method applies a constant rate to the declining book value, resulting in larger depreciation charges in earlier years.' },
  { id:7,  subj:'FAR',  q:'Under PFRS 15, the core principle for revenue recognition is:',
    opts:['Revenue is recognized when cash is collected','Recognize revenue to depict the transfer of promised goods or services in an amount that reflects the consideration the entity expects to receive','Revenue equals sales price times quantity','Revenue recognized only after warranty period expires'],
    ans:1, exp:'PFRS 15\'s core principle is recognizing revenue in a manner that reflects the transfer of goods/services and the consideration the entity expects to be entitled to.' },
  { id:8,  subj:'FAR',  q:'A contingent liability is recognized on the balance sheet when:',
    opts:['It is possible and estimable','It is probable and estimable','It is remote','The lawsuit is filed'],
    ans:1, exp:'Under PAS 37, a provision (contingent liability recognized as liability) is recorded only when an outflow is probable and the amount can be reliably estimated.' },
  { id:9,  subj:'FAR',  q:'Bonds issued at a premium result in:',
    opts:['Carrying value increasing over time','Effective interest expense less than cash interest','Effective interest expense greater than cash interest','No change in carrying value'],
    ans:1, exp:'When bonds are issued at a premium, the coupon rate exceeds the effective rate. The premium is amortized, reducing carrying value and making effective interest less than cash paid.' },
  { id:10, subj:'FAR',  q:'Which financial statement shows changes in equity during a period?',
    opts:['Balance Sheet','Income Statement','Statement of Changes in Equity','Notes to Financial Statements'],
    ans:2, exp:'The Statement of Changes in Equity presents movements in each component of equity such as share capital, retained earnings, and other reserves during the period.' },
  { id:11, subj:'FAR',  q:'An impairment loss on property, plant and equipment is recognized when:',
    opts:['Carrying amount exceeds recoverable amount','Recoverable amount exceeds carrying amount','Asset is fully depreciated','Asset is sold'],
    ans:0, exp:'PAS 36 requires recognition of an impairment loss when the carrying amount of an asset exceeds its recoverable amount (higher of value in use and fair value less costs to sell).' },
  { id:12, subj:'FAR',  q:'Which of the following is classified as a current asset?',
    opts:['Land','Goodwill','Trade receivables expected to be collected within 12 months','Long-term investment in bonds'],
    ans:2, exp:'Current assets include trade receivables expected to be converted to cash within the normal operating cycle or 12 months from the reporting date.' },
  { id:13, subj:'FAR',  q:'The straight-line method of depreciation allocates cost:',
    opts:['Based on usage','Equally over the useful life','More in early years','Based on revenue generated'],
    ans:1, exp:'Under the straight-line method, an equal amount of depreciation is charged each period over the asset\'s estimated useful life.' },
  { id:14, subj:'FAR',  q:'Research costs under PAS 38 are:',
    opts:['Capitalized as intangible assets','Expensed as incurred','Capitalized if future benefits are probable','Deferred and amortized'],
    ans:1, exp:'PAS 38 requires research costs to be expensed as incurred because, at the research stage, an entity cannot demonstrate that an intangible asset will be created.' },
  { id:15, subj:'FAR',  q:'An entity uses the equity method when it holds:',
    opts:['Less than 5% of shares','Significant influence (typically 20–50%)','Majority control (>50%)','100% ownership'],
    ans:1, exp:'The equity method is used for investments where the investor has significant influence over the investee, generally presumed when 20–50% of voting shares are held (PAS 28).' },
  { id:16, subj:'FAR',  q:'Deferred tax liabilities arise when:',
    opts:['Tax base > carrying amount','Carrying amount > tax base for assets','Tax loss carryforwards exist','Prepaid taxes are recorded'],
    ans:1, exp:'A deferred tax liability arises when the carrying amount of an asset exceeds its tax base, as the future taxable amounts will be higher when the asset is recovered.' },
  { id:17, subj:'FAR',  q:'Under PFRS 16, lessees generally must:',
    opts:['Expense all lease payments immediately','Recognize a right-of-use asset and lease liability','Only disclose the lease in notes','Capitalize only finance leases'],
    ans:1, exp:'PFRS 16 requires lessees to recognize a right-of-use asset and corresponding lease liability for most leases, eliminating the old operating vs. finance lease distinction for lessees.' },
  { id:18, subj:'FAR',  q:'The going concern assumption means:',
    opts:['The entity will be profitable','The entity will continue operating for the foreseeable future','The entity has no debt','Financial statements are prepared at cost'],
    ans:1, exp:'The going concern assumption presumes the entity will continue to operate for the foreseeable future and has no intention or necessity to liquidate or cease operations.' },
  { id:19, subj:'FAR',  q:'Inventories are measured at:',
    opts:['Cost only','Lower of cost and net realizable value','Market value','Replacement cost'],
    ans:1, exp:'PAS 2 requires inventories to be measured at the lower of cost and net realizable value (NRV) to apply conservatism and prevent overstatement.' },
  { id:20, subj:'FAR',  q:'The effective interest method amortizes bond discount/premium based on:',
    opts:['Straight-line allocation','Carrying amount times the effective interest rate','Face amount times the coupon rate','Management discretion'],
    ans:1, exp:'The effective interest method applies the market (effective) interest rate to the bond\'s carrying amount each period, producing a constant rate of return over the bond\'s life.' },

  // ── AUDITING & ASSURANCE ──
  { id:21, subj:'AUD',  q:'The primary responsibility for the financial statements rests with:',
    opts:['The external auditor','Management of the entity','The board of directors','Regulatory authorities'],
    ans:1, exp:'Management is responsible for the preparation and fair presentation of financial statements. The auditor\'s role is to express an independent opinion on those statements.' },
  { id:22, subj:'AUD',  q:'An unmodified (clean) audit opinion means:',
    opts:['The entity is profitable','Financial statements are prepared on a cash basis','Financial statements present fairly in all material respects','No errors were found'],
    ans:2, exp:'An unmodified opinion indicates that the auditor concludes the financial statements present fairly, in all material respects, in accordance with the applicable financial reporting framework.' },
  { id:23, subj:'AUD',  q:'Audit risk is the risk that:',
    opts:['A material misstatement exists','The auditor issues an incorrect opinion on materially misstated statements','Internal controls fail','Management commits fraud'],
    ans:1, exp:'Audit risk (AR) is the risk that the auditor expresses an inappropriate opinion when financial statements are materially misstated. AR = IR × CR × DR.' },
  { id:24, subj:'AUD',  q:'Which of the following is an example of a substantive procedure?',
    opts:['Walkthroughs of internal controls','Reperformance of bank reconciliation','Inspection of access logs','Inquiry of control owners'],
    ans:1, exp:'Substantive procedures are designed to detect material misstatements. Reperforming the bank reconciliation tests the accuracy of the cash balance directly.' },
  { id:25, subj:'AUD',  q:'Professional skepticism requires the auditor to:',
    opts:['Assume management is dishonest','Accept all management representations','Critically assess audit evidence with a questioning mind','Skip procedures when management is cooperative'],
    ans:2, exp:'Professional skepticism involves a questioning mind and critical assessment of evidence. It does not mean assuming dishonesty but being alert to conditions suggesting misstatement.' },
  { id:26, subj:'AUD',  q:'A qualified opinion is issued when:',
    opts:['Misstatements are pervasive','There is a material but not pervasive misstatement or scope limitation','The auditor cannot form an opinion','Going concern doubt exists'],
    ans:1, exp:'A qualified opinion ("except for") is appropriate when there is a material but not pervasive misstatement or a limitation on the scope of audit that is material but not pervasive.' },
  { id:27, subj:'AUD',  q:'Internal control is designed primarily to:',
    opts:['Guarantee no fraud occurs','Provide reasonable assurance of achieving objectives','Eliminate all operational errors','Replace the external audit'],
    ans:1, exp:'Internal controls provide reasonable—not absolute—assurance regarding the achievement of objectives related to operations, reporting, and compliance.' },
  { id:28, subj:'AUD',  q:'The concept of materiality in auditing means:',
    opts:['Any error is reported','Only errors above a threshold affecting decisions of users are considered significant','All discrepancies are equally important','Materiality is set by management'],
    ans:1, exp:'Materiality is information whose omission or misstatement could influence economic decisions. Auditors set a threshold and focus on misstatements that exceed it.' },
  { id:29, subj:'AUD',  q:'Which sampling method gives every item an equal chance of selection?',
    opts:['Haphazard sampling','Judgmental sampling','Statistical random sampling','Systematic sampling with a random start'],
    ans:2, exp:'Statistical random sampling uses probability theory to ensure every item in the population has a known and equal chance of selection, allowing objective evaluation of results.' },
  { id:30, subj:'AUD',  q:'An adverse opinion is issued when financial statements:',
    opts:['Contain a material but non-pervasive misstatement','Are fairly presented','Are pervasively misstated','Have a scope limitation'],
    ans:2, exp:'An adverse opinion is the most severe modification, issued when misstatements are both material AND pervasive, meaning the statements do not present fairly.' },
  { id:31, subj:'AUD',  q:'Analytical procedures used in the planning phase are intended to:',
    opts:['Provide detailed audit evidence','Identify areas of potential risk','Replace substantive testing','Form the audit opinion'],
    ans:1, exp:'During planning, analytical procedures help the auditor understand the entity and identify areas of significant risk that may require additional attention during the audit.' },
  { id:32, subj:'AUD',  q:'A letter of representation from management is:',
    opts:['Sufficient audit evidence on its own','Written confirmation of oral statements and acknowledgment of responsibility','Optional in all audits','Used to replace physical inspection'],
    ans:1, exp:'Management representation letters confirm oral statements made during the audit and acknowledge management\'s responsibility for the financial statements. They are required but not sole evidence.' },
  { id:33, subj:'AUD',  q:'The auditor\'s primary objective when auditing cash is to test for:',

let userAnswers = {};
let currentFilter = 'all';
let displayOrder = QUESTIONS.map((_,i)=>i);

function getFiltered() {
  return displayOrder
    .map(i => QUESTIONS[i])
    .filter(q => currentFilter === 'all' || q.subj === currentFilter);
}

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  const filtered = getFiltered();
  container.innerHTML = '';
  filtered.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + q.id;
    const answered = userAnswers[q.id] !== undefined;
    if (answered) {
      card.classList.add(userAnswers[q.id] === q.ans ? 'answered-correct' : 'answered-wrong');
    }

    const letters = ['A','B','C','D'];
    let optionsHTML = q.opts.map((opt,oi) => {
      let cls = 'option-btn';
      if (answered) {
        if (oi === q.ans) cls += ' reveal';
        if (oi === userAnswers[q.id] && oi !== q.ans) cls += ' wrong';
        if (oi === userAnswers[q.id] && oi === q.ans) cls = 'option-btn correct';
      }
      return `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="selectAnswer(${q.id}, ${oi})">
        <span class="option-letter">${letters[oi]}</span>
        <span>${opt}</span>
      </button>`;
    }).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${idx + 1}</div>
        <div style="flex:1;font-size:.82rem;color:var(--muted);line-height:1.4;">&nbsp;</div>
        <div class="q-subject">${q.subj}</div>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options-list">${optionsHTML}</div>
      <div class="explanation ${answered ? 'show' : ''}" id="exp-${q.id}">
        <strong>Explanation:</strong> ${q.exp}
      </div>`;
    container.appendChild(card);
  });
  updateStats();
}

function selectAnswer(qid, chosenIdx) {
  if (userAnswers[qid] !== undefined) return;
  userAnswers[qid] = chosenIdx;
  const q = QUESTIONS.find(x => x.id === qid);
  const card = document.getElementById('card-' + qid);
  const btns = card.querySelectorAll('.option-btn');
  btns.forEach((b,i) => {
    b.disabled = true;
    if (i === q.ans) b.className = 'option-btn reveal';
    if (i === chosenIdx && chosenIdx !== q.ans) b.className = 'option-btn wrong';
    if (i === chosenIdx && chosenIdx === q.ans) b.className = 'option-btn correct';
  });
  card.classList.add(chosenIdx === q.ans ? 'answered-correct' : 'answered-wrong');
  document.getElementById('exp-' + qid).classList.add('show');
  updateStats();
}

function updateStats() {
  const total = QUESTIONS.length;
  const answered = Object.keys(userAnswers).length;
  const correct = Object.entries(userAnswers).filter(([id,ch]) => {
    const q = QUESTIONS.find(x => x.id == id);
    return q && ch === q.ans;
  }).length;
  document.getElementById('score-val').textContent = correct;
  document.getElementById('answered-val').textContent = answered;
  document.getElementById('remaining-val').textContent = total - answered;
  const pct = Math.round((answered / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('pct-label').textContent = pct + '%';
}

function submitAll() {
  const unanswered = QUESTIONS.filter(q => userAnswers[q.id] === undefined);
  if (unanswered.length > 0) {
    const msg = unanswered.length === 1
      ? 'You have 1 unanswered question. Submit anyway?'
      : `You have ${unanswered.length} unanswered questions. Submit anyway?`;
    if (!confirm(msg)) return;
  }
  const correct = Object.entries(userAnswers).filter(([id,ch]) => {
    const q = QUESTIONS.find(x => x.id == id);
    return q && ch === q.ans;
  }).length;
  const total = QUESTIONS.length;
  const pct = Math.round((correct / total) * 100);
  document.getElementById('final-score').textContent = correct;
  const gradeEl = document.getElementById('result-grade');
  const iconEl  = document.getElementById('result-icon');
  const msgEl   = document.getElementById('result-msg');
  if (pct >= 75) {
    gradeEl.className = 'result-grade grade-pass';
    gradeEl.textContent = 'PASSED · ' + pct + '%';
    iconEl.textContent = '🏆';
    msgEl.textContent = 'Congratulations! You met the passing standard. Keep it up, future CPA!';
  } else {
    gradeEl.className = 'result-grade grade-fail';
    gradeEl.textContent = 'NEEDS IMPROVEMENT · ' + pct + '%';
    iconEl.textContent = '📚';
    msgEl.textContent = 'You didn\'t reach 75% this time. Review the topics and try again — you\'ve got this!';
  }
  document.getElementById('result-banner').classList.add('show');
  document.getElementById('result-banner').scrollIntoView({ behavior: 'smooth' });
}

function resetQuiz() {
  userAnswers = {};
  document.getElementById('result-banner').classList.remove('show');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shuffleQuestions() {
  for (let i = displayOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [displayOrder[i], displayOrder[j]] = [displayOrder[j], displayOrder[i]];
  }
  renderQuiz();
}

function filterTab(el, subj) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentFilter = subj;
  renderQuiz();
}

renderQuiz();
</script>
</body>
</html>
